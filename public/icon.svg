<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Sfondo nero con corner radius stile iOS (22%) -->
  <rect x="0" y="0" width="1024" height="1024" rx="225" ry="225" fill="#000000"/>

  <!-- Parallelogramma rosso (brand-mark Pitwall): inclinato a destra in cima -->
  <!-- Equivale a clip-path: polygon(20% 0, 100% 0, 80% 100%, 0 100%) -->
  <polygon points="432,220 712,220 632,660 352,660" fill="#E8002D"/>

  <!-- Logo "PITUFOS." -->
  <text x="512" y="855"
        font-family="Inter, 'DejaVu Sans', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900"
        font-size="160"
        letter-spacing="-2"
        text-anchor="middle"
        fill="#FFFFFF">PITUFOS<tspan fill="#E8002D">.</tspan></text>
</svg>
